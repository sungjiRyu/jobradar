name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'jobradar-backend/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Test
        run: ./gradlew test
        working-directory: jobradar-backend

      - name: Build
        run: ./gradlew build -x test
        working-directory: jobradar-backend

  push-ecr:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check whether image already exists
        id: check-image
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          digest=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'images[0].imageId.imageDigest' \
            --output text)

          if [[ -n "$digest" && "$digest" != "None" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        if: steps.check-image.outputs.exists == 'false'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.check-image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build-image
        if: steps.check-image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: jobradar-backend
          file: jobradar-backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Print image digest
        env:
          IMAGE_EXISTS: ${{ steps.check-image.outputs.exists }}
          EXISTING_DIGEST: ${{ steps.check-image.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          if [[ "$IMAGE_EXISTS" == "true" ]]; then
            echo "Image already exists with digest $EXISTING_DIGEST"
          else
            echo "Pushed image digest $PUSHED_DIGEST"
          fi

  deploy-blue-green:
    needs: push-ecr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve active and standby target groups
        id: target-groups
        env:
          ALB_HTTPS_LISTENER_ARN: ${{ vars.ALB_HTTPS_LISTENER_ARN }}
          BLUE_TARGET_GROUP_ARN: ${{ vars.BLUE_TARGET_GROUP_ARN }}
          GREEN_TARGET_GROUP_ARN: ${{ vars.GREEN_TARGET_GROUP_ARN }}
        run: |
          listener=$(aws elbv2 describe-listeners \
            --listener-arns "$ALB_HTTPS_LISTENER_ARN" \
            --output json)

          active_tg=$(jq -r '
            .Listeners[0].DefaultActions[0]
            | if .ForwardConfig then .ForwardConfig.TargetGroups[0].TargetGroupArn else .TargetGroupArn end
          ' <<< "$listener")

          if [[ "$active_tg" == "$BLUE_TARGET_GROUP_ARN" ]]; then
            standby_tg="$GREEN_TARGET_GROUP_ARN"
            active_color="blue"
            standby_color="green"
          elif [[ "$active_tg" == "$GREEN_TARGET_GROUP_ARN" ]]; then
            standby_tg="$BLUE_TARGET_GROUP_ARN"
            active_color="green"
            standby_color="blue"
          else
            echo "Active target group $active_tg is not one of the configured blue/green target groups."
            exit 1
          fi

          echo "active_tg=$active_tg" >> "$GITHUB_OUTPUT"
          echo "standby_tg=$standby_tg" >> "$GITHUB_OUTPUT"
          echo "active_color=$active_color" >> "$GITHUB_OUTPUT"
          echo "standby_color=$standby_color" >> "$GITHUB_OUTPUT"
          echo "Deploying new $standby_color instance. Current active target group is $active_color."

      - name: Create deployment script
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          cat > deploy-backend-ssm.sh <<SCRIPT
          bash <<'DEPLOY_SCRIPT'
          set -Eeuo pipefail

          AWS_ACCOUNT_ID="$AWS_ACCOUNT_ID"
          AWS_REGION="$AWS_REGION"
          ECR_REPOSITORY="$ECR_REPOSITORY"
          IMAGE_TAG="$IMAGE_TAG"
          SCRIPT

          cat >> deploy-backend-ssm.sh <<'SCRIPT'

          APP_DIR="/opt/jobradar"
          CONTAINER_NAME="jobradar-backend"
          PARAM_PATH="/jobradar/prod"

          IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          wait_for_instance_bootstrap() {
            if command -v cloud-init >/dev/null 2>&1; then
              cloud-init status --wait || true
            fi
          }

          ensure_docker() {
            if ! command -v docker >/dev/null 2>&1; then
              if command -v dnf >/dev/null 2>&1; then
                dnf install -y docker
              elif command -v yum >/dev/null 2>&1; then
                yum install -y docker
              elif command -v apt-get >/dev/null 2>&1; then
                apt-get update -y
                apt-get install -y docker.io
              else
                echo "No supported package manager found to install Docker."
                exit 1
              fi
            fi

            systemctl enable --now docker

            for attempt in {1..30}; do
              if docker info >/dev/null 2>&1; then
                return 0
              fi
              echo "Waiting for Docker daemon ($attempt/30)."
              sleep 2
            done

            echo "Docker daemon did not become ready."
            systemctl status docker --no-pager || true
            exit 1
          }

          wait_for_instance_bootstrap
          ensure_docker

          mkdir -p "$APP_DIR"
          cd "$APP_DIR"

          get_param() {
            aws ssm get-parameter \
              --region "$AWS_REGION" \
              --name "$PARAM_PATH/$1" \
              --with-decryption \
              --query 'Parameter.Value' \
              --output text
          }

          umask 077
          {
            echo "SPRING_PROFILES_ACTIVE=prod"
            echo "DB_HOST=$(get_param DB_HOST)"
            echo "DB_USERNAME=$(get_param DB_USERNAME)"
            echo "DB_PASSWORD=$(get_param DB_PASSWORD)"
            echo "REDIS_HOST=$(get_param REDIS_HOST)"
            echo "REDIS_PORT=$(get_param REDIS_PORT)"
            echo "REDIS_SSL=$(get_param REDIS_SSL)"
            echo "CORS_ALLOWED_ORIGINS=$(get_param CORS_ALLOWED_ORIGINS)"
            echo "JWT_SECRET=$(get_param JWT_SECRET)"
            echo "GROQ_API_KEY=$(get_param GROQ_API_KEY)"
            echo "AI_MODEL=$(get_param AI_MODEL)"
            echo "AI_BASE_URL=$(get_param AI_BASE_URL)"
          } > app.env.tmp
          mv app.env.tmp app.env

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          docker pull "$IMAGE"
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --env-file "$APP_DIR/app.env" \
            -p 8080:8080 \
            "$IMAGE"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8080/actuator/health; then
              echo
              echo "Deployment succeeded with image $IMAGE"
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed. Recent container logs:"
          docker logs --tail=200 "$CONTAINER_NAME"
          exit 1
          DEPLOY_SCRIPT
          SCRIPT

      - name: Launch standby EC2
        id: launch
        env:
          BACKEND_LAUNCH_TEMPLATE_ID: ${{ vars.BACKEND_LAUNCH_TEMPLATE_ID }}
          BACKEND_SECURITY_GROUP_ID: ${{ vars.BACKEND_SECURITY_GROUP_ID }}
          BACKEND_SUBNET_IDS: ${{ vars.BACKEND_SUBNET_IDS }}
          STANDBY_COLOR: ${{ steps.target-groups.outputs.standby_color }}
        run: |
          IFS=',' read -ra subnets <<< "$BACKEND_SUBNET_IDS"
          if [[ "${#subnets[@]}" -eq 0 || -z "${subnets[0]}" ]]; then
            echo "BACKEND_SUBNET_IDS must contain at least one subnet id."
            exit 1
          fi

          subnet_index=$((GITHUB_RUN_NUMBER % ${#subnets[@]}))
          subnet_id="${subnets[$subnet_index]}"
          short_sha="${GITHUB_SHA:0:7}"

          instance_id=$(aws ec2 run-instances \
            --launch-template LaunchTemplateId="$BACKEND_LAUNCH_TEMPLATE_ID",Version='$Latest' \
            --network-interfaces "DeviceIndex=0,SubnetId=$subnet_id,Groups=[$BACKEND_SECURITY_GROUP_ID],AssociatePublicIpAddress=true,DeleteOnTermination=true" \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=jobradar-${STANDBY_COLOR}-${short_sha}},{Key=App,Value=jobradar-backend},{Key=Role,Value=${STANDBY_COLOR}},{Key=GitSha,Value=${GITHUB_SHA}},{Key=GitHubRunId,Value=${GITHUB_RUN_ID}}]" \
            --query 'Instances[0].InstanceId' \
            --output text)

          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
          echo "Launched standby EC2 $instance_id in $subnet_id"

      - name: Wait for standby EC2 and SSM
        env:
          INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
        run: |
          aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"

          for attempt in {1..40}; do
            ping_status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)

            if [[ "$ping_status" == "Online" ]]; then
              echo "SSM is online for $INSTANCE_ID"
              exit 0
            fi

            echo "Waiting for SSM agent on $INSTANCE_ID ($attempt/40). Current status: $ping_status"
            sleep 15
          done

          echo "SSM agent did not become online for $INSTANCE_ID."
          exit 1

      - name: Send deployment command
        id: send-command
        env:
          BACKEND_INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
        run: |
          jq -n \
            --rawfile script deploy-backend-ssm.sh \
            '{commands: [$script], executionTimeout: ["900"]}' > ssm-parameters.json

          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$BACKEND_INSTANCE_ID" \
            --comment "Deploy JobRadar backend image ${{ github.sha }}" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command $command_id"

      - name: Wait for deployment result
        env:
          BACKEND_INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
        run: |
          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$BACKEND_INSTANCE_ID"
          wait_status=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$BACKEND_INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json

          exit "$wait_status"

      - name: Register standby target and wait healthy
        env:
          ALB_HTTPS_LISTENER_ARN: ${{ vars.ALB_HTTPS_LISTENER_ARN }}
          ACTIVE_TARGET_GROUP_ARN: ${{ steps.target-groups.outputs.active_tg }}
          STANDBY_TARGET_GROUP_ARN: ${{ steps.target-groups.outputs.standby_tg }}
          BACKEND_INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
        run: |
          aws elbv2 register-targets \
            --target-group-arn "$STANDBY_TARGET_GROUP_ARN" \
            --targets Id="$BACKEND_INSTANCE_ID",Port=8080

          aws elbv2 modify-listener \
            --listener-arn "$ALB_HTTPS_LISTENER_ARN" \
            --default-actions "Type=forward,ForwardConfig={TargetGroups=[{TargetGroupArn=$ACTIVE_TARGET_GROUP_ARN,Weight=100},{TargetGroupArn=$STANDBY_TARGET_GROUP_ARN,Weight=0}],TargetGroupStickinessConfig={Enabled=false}}"

          aws elbv2 wait target-in-service \
            --target-group-arn "$STANDBY_TARGET_GROUP_ARN" \
            --targets Id="$BACKEND_INSTANCE_ID",Port=8080

      - name: Switch ALB listener to standby target group
        env:
          ALB_HTTPS_LISTENER_ARN: ${{ vars.ALB_HTTPS_LISTENER_ARN }}
          STANDBY_TARGET_GROUP_ARN: ${{ steps.target-groups.outputs.standby_tg }}
        run: |
          aws elbv2 modify-listener \
            --listener-arn "$ALB_HTTPS_LISTENER_ARN" \
            --default-actions Type=forward,TargetGroupArn="$STANDBY_TARGET_GROUP_ARN"

      - name: Smoke test active API
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          health_url="${BACKEND_HEALTH_URL:-https://api.jobradar.me/actuator/health}"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$health_url"; then
              echo
              echo "ALB switch succeeded. $health_url is healthy."
              exit 0
            fi

            echo "Waiting for active API health check ($attempt/30)."
            sleep 2
          done

          echo "Smoke test failed after ALB switch."
          exit 1

      - name: Roll back ALB listener on failure
        if: failure() && steps.target-groups.outputs.active_tg != ''
        env:
          ALB_HTTPS_LISTENER_ARN: ${{ vars.ALB_HTTPS_LISTENER_ARN }}
          ACTIVE_TARGET_GROUP_ARN: ${{ steps.target-groups.outputs.active_tg }}
        run: |
          aws elbv2 modify-listener \
            --listener-arn "$ALB_HTTPS_LISTENER_ARN" \
            --default-actions Type=forward,TargetGroupArn="$ACTIVE_TARGET_GROUP_ARN"

      - name: Deregister previous targets
        if: success()
        env:
          ACTIVE_TARGET_GROUP_ARN: ${{ steps.target-groups.outputs.active_tg }}
        run: |
          target_ids=$(aws elbv2 describe-target-health \
            --target-group-arn "$ACTIVE_TARGET_GROUP_ARN" \
            --query 'TargetHealthDescriptions[].Target.Id' \
            --output text)

          if [[ -z "$target_ids" || "$target_ids" == "None" ]]; then
            echo "No previous targets to deregister."
            exit 0
          fi

          targets=()
          for target_id in $target_ids; do
            targets+=("Id=$target_id,Port=8080")
          done

          aws elbv2 deregister-targets \
            --target-group-arn "$ACTIVE_TARGET_GROUP_ARN" \
            --targets "${targets[@]}"

          echo "PREVIOUS_INSTANCE_IDS=$target_ids" >> "$GITHUB_ENV"
          echo "Deregistered previous targets: $target_ids"

      - name: Terminate previous EC2 instances when enabled
        if: success() && vars.AUTO_TERMINATE_OLD_BACKEND == 'true'
        run: |
          if [[ -z "$PREVIOUS_INSTANCE_IDS" ]]; then
            echo "No previous EC2 instances to terminate."
            exit 0
          fi

          aws ec2 terminate-instances --instance-ids $PREVIOUS_INSTANCE_IDS

      - name: Terminate failed standby EC2
        if: failure() && steps.launch.outputs.instance_id != ''
        env:
          STANDBY_INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
          STANDBY_TARGET_GROUP_ARN: ${{ steps.target-groups.outputs.standby_tg }}
        run: |
          if [[ -n "$STANDBY_TARGET_GROUP_ARN" ]]; then
            aws elbv2 deregister-targets \
              --target-group-arn "$STANDBY_TARGET_GROUP_ARN" \
              --targets Id="$STANDBY_INSTANCE_ID",Port=8080 || true
          fi

          aws ec2 terminate-instances --instance-ids "$STANDBY_INSTANCE_ID"
