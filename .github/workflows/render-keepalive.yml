name: Render Keepalive

on:
  schedule:
    # 02, 07, ... 57분: 정각 혼잡을 피하되 5분 간격 유지
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    if: vars.RENDER_HEALTH_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check Render health
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          status=$(curl --silent --show-error --fail \
            --proto '=https' --connect-timeout 10 --max-time 90 \
            --retry 1 --retry-delay 5 --retry-max-time 100 \
            --output /dev/null --write-out '%{http_code}' "$HEALTH_URL")
          if [[ "$status" != "200" ]]; then
            echo "Unexpected health response: $status"
            exit 1
          fi
          echo "Render health: HTTP 200"
