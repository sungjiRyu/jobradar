services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: job_radar
      MYSQL_USER: jobradar
      MYSQL_PASSWORD: jobradar-local-password
      MYSQL_ROOT_PASSWORD: root-local-password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
    image: jobradar-backend:local
    ports:
      - "${BACKEND_PORT:-18080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      DB_HOST: mysql
      DB_USERNAME: jobradar
      DB_PASSWORD: jobradar-local-password
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      JWT_SECRET: local-jwt-secret-key-must-be-at-least-256-bits-long
      VERTEX_PROJECT_ID: local
      VERTEX_LOCATION: us-central1
      VERTEX_MODEL: gemini-2.5-flash-lite
      VERTEX_CREDENTIALS_PATH: ""
    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_healthy
