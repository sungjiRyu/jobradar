# prod,cloud: Render와 GitHub Actions에서 공유하는 Aiven 연결 설정
spring:
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:true}
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:10494}/${DB_NAME:defaultdb}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&sslMode=VERIFY_IDENTITY
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      data-source-properties:
        trustCertificateKeyStoreUrl: file:${DB_TRUSTSTORE_PATH:/tmp/jobradar-mysql-truststore.p12}
        trustCertificateKeyStoreType: PKCS12
        trustCertificateKeyStorePassword: changeit
        fallbackToSystemTrustStore: false
  data:
    redis:
      username: ${REDIS_USERNAME:default}
      ssl:
        enabled: true

app:
  redisson:
    threads: ${REDISSON_THREADS:2}
    netty-threads: ${REDISSON_NETTY_THREADS:2}
  scheduling:
    enabled: false
