spring:
  application:
    name: jobradar-backend

  # ===== MySQL (환경변수로 주입) =====
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/job_radar?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ===== JPA =====
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ===== Redis (EC2 내부 localhost) =====
  data:
    redis:
      host: localhost
      port: 6379

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000
  refresh-expiration: 604800000

# ===== Vertex AI =====
vertex:
  project-id: ${VERTEX_PROJECT_ID}
  location: ${VERTEX_LOCATION:us-central1}
  model: ${VERTEX_MODEL:gemini-2.5-flash-lite}
  credentials-path: ${VERTEX_CREDENTIALS_PATH}

# ===== Server =====
server:
  port: 8080
