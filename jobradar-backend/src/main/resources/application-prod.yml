spring:
  application:
    name: jobradar-backend

  # ===== MySQL (환경변수로 주입) =====
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/job_radar?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ===== JPA =====
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Seoul

  # ===== Redis (환경변수로 주입) =====
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL:false}

# ===== CORS =====
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000
  refresh-expiration: 604800000

# ===== AI Summary =====
ai:
  base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
  api-key: ${GROQ_API_KEY:${AI_API_KEY:}}
  model: ${AI_MODEL:openai/gpt-oss-120b}

# ===== Server =====
server:
  port: 8080

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
